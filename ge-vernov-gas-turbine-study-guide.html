const LES=[
["energy","Energy conversion chain and Brayton cycle","Chemical energy in fuel becomes thermal energy in the combustor, kinetic energy in accelerated hot gas, mechanical shaft work in the turbine rotor, and electrical energy in the generator. The simple gas turbine follows the Brayton cycle: compression, constant-pressure heat addition, expansion, and heat rejection. Air enters the inlet, the compressor raises pressure and temperature, fuel burns at nearly constant pressure, hot gas expands through turbine stages, and exhaust leaves with remaining heat. The compressor consumes a large share of gross turbine work, so small changes in airflow, pressure ratio, fouling, inlet temperature, or extraction can create large changes in net output and heat rate."],
["components","Major components: inlet, compressor, combustion, turbine, exhaust","The inlet filters, silences, conditions, and guides ambient air to the compressor. The axial compressor uses rotating blades and stationary vanes to raise air pressure and temperature. The combustion section mixes fuel with compressed air and burns it in liners, transition pieces, and fuel nozzles. The turbine converts hot gas energy into shaft work through nozzles and buckets. The exhaust system directs flow away from the turbine and may feed a heat recovery steam generator. Each component can create a performance penalty when it is dirty, restricted, damaged, misaligned, or operated outside the intended range."],
["work","Energy budget and work equation","Gross turbine work is produced by expansion through the turbine. Compressor work is subtracted because the compressor is mounted on the same shaft. Net shaft work equals turbine work minus compressor work minus mechanical losses and auxiliary loads. Power is proportional to mass flow multiplied by useful enthalpy drop. Heat rate is fuel energy input divided by electrical output, so lower heat rate means higher efficiency. Thermal efficiency percent equals 3412 divided by heat rate in Btu per kilowatt-hour, multiplied by 100."],
["terms","Key terms with precise definitions","ISO rating is the standard rating at 59 degrees Fahrenheit, sea-level pressure, and specified humidity. Heat rate is fuel energy per kilowatt-hour; lower is better. Output is useful power. Firing temperature is the effective turbine inlet temperature used for control. Pressure ratio is compressor discharge absolute pressure divided by inlet absolute pressure. CPD is compressor discharge pressure, CTD is compressor discharge temperature, and TXT is exhaust temperature. FSR is Fuel Stroke Reference. IGVs are inlet guide vanes. Bleed valves unload compressor stages. Surge is unstable compressor flow oscillation or reversal. Stall is local compressor blade flow separation. LHV excludes latent heat of water vapor; HHV includes it. DLN means Dry Low NOx."],
["perf","Performance factors and graph anchors","Figure 9: Output decreases and heat rate increases as temperature rises above 59°F ISO. At 20°F ambient, output is about 115% and heat rate about 96%. At 100°F ambient, output is about 87% and heat rate about 108%. Humidity is smaller: ISO specific humidity is 0.0064 lb water vapor per lb dry air. More humidity means slightly higher heat rate and slightly lower output. Altitude reduces density and mass flow. At 3000 ft, correction factor is about 0.90, so 100 MW times 0.90 equals 90 MW. Atmospheric pressure is about 13.2 PSIA at 3000 ft versus 14.7 PSIA at sea level."],
["graphs","Every required performance graph in words","Figure 12 for MS7001EA: 4 in H2O inlet drop equals 1.42% power loss, 0.45% heat-rate increase, and 1.9°F exhaust temperature rise. 4 in H2O exhaust drop equals 0.42% power loss, 0.42% heat-rate increase, and 1.9°F exhaust temperature rise. Inlet is 3x more penalizing than exhaust. Figure 13: pure H2 has highest LHV and needs least fuel mass; low-BTU syngas needs highest mass flow and can push output above 100%. Figure 14: each 1% steam injection as fraction of airflow raises output curve upward at all ambient temperatures; liquid fuel only, while gas fuel uses DLN. Figure 15: at 20% extraction, output falls 35-40% and heat rate rises 70-80%. Figure 16: evaporative cooling is best at high ambient temperature and low humidity, cannot cool below wet-bulb temperature, and at 100°F and 20% RH recovers about 10-12% output. Fouling chart: at 5% pressure ratio decrease with 5% airflow loss, heat rate increases about 7% and output decreases about 13%."],
["protect","Compressor protection: IGVs and bleed valves","Compressor protection prevents surge, rotating stall, vibration, and thermal stress. Inlet guide vanes control inlet airflow and swirl. During startup they are positioned to control airflow and protect surge margin; as the unit accelerates and loads, they open to increase airflow and output. Bleed valves vent selected compressor stages during startup and shutdown. Opening bleed valves lowers back pressure and unloads early stages. As speed increases, bleed valves close in sequence so more air reaches combustion and cooling. A bleed valve failed open at load reduces output and worsens heat rate. A bleed valve failed closed during acceleration raises surge risk."],
["cool","Turbine cooling architecture: E, F, and H class","Hot gas path parts survive because cooling air or steam keeps metal temperature below material limits. E-class machines use compressor extraction and discharge air in open-loop cooling circuits. F-class S1N is cooled by compressor discharge air open loop with delta-T of 280°F. F-class S1B is cooled by 16th/17th stage extraction through the rotor shaft. S2N uses 13th-stage air. S3N uses 9th-stage air. H-class S1N uses closed-loop steam cooling with delta-T of 80°F. Cooling source matters because pressure, temperature, cleanliness, and flow determine part life."],
["fsr","FSR effects, model designation codes, and exam rapid fire","FSR means Fuel Stroke Reference. The cascade is: FSR up, more fuel, higher firing temperature, higher delta-T, higher CPD, higher TXT, higher output. In MS7001EA, MS identifies a heavy-duty gas turbine model series, 7 identifies frame size, 001 identifies design series, E identifies technology class, and A identifies variant or revision. Rapid exam cues: inlet restriction hurts more than exhaust restriction, fouling hurts heat rate and output at the same time, extraction is a severe double penalty, evaporative cooling works best when air is hot and dry, and humidity is small compared with temperature or altitude."],
["plan","Seven-day learning strategy","Day 1: energy chain and Brayton states. Day 2: components and key terms. Day 3: performance factors and exact graph numbers. Day 4: compressor protection and cooling architecture. Day 5: worked examples and machine comparison. Day 6: flashcards, matching, and fill-in-the-blank until weak cards repeat less often. Day 7: rapid fire and quizzes until every explanation feels predictable. The point is to connect airflow, pressure, temperature, fuel, cooling, losses, and output."],
];

let rq=[],ri=0,rs=0,rt=null,time=5;function renderRapid(){rapid.innerHTML=`<div class="box"><h2>Rapid Fire</h2><div class="controls"><label>Topic <select id="rp">${topics(Q).map(t=>`<option>${t}</option>`)}</select></label><button class="primary" onclick="startRapid()">Start</button><span class="timer" id="clock">5</span><span class="score" id="rscore"></span></div><div id="rbody"></div></div>`}function startRapid(){let t=rp.value;rq=sh(Q.filter(x=>t=="All"||x[0]==t));ri=rs=0;showRapid()}function showRapid(){clearInterval(rt);if(ri>=rq.length){rbody.innerHTML=`<div class="card"><h3>Rapid Fire complete</h3><p class="score">${rs}/${rq.length} • ${Math.round(rs/rq.length*100)}%</p></div>`;clock.textContent=0;return}time=5;let q=rq[ri];rscore.textContent=`${ri+1}/${rq.length} • score ${rs}`;rbody.innerHTML=`<h3>${q[1]}</h3>${q[2].map((c,i)=>`<button class="choice" onclick="ansRapid(${i})">${c}</button>`).join("")}<div id="re"></div>`;clock.textContent=time;rt=setInterval(()=>{clock.textContent=--time;if(time<=0){clearInterval(rt);re.innerHTML=`<div class="explain"><b>Time.</b> ${q[4]}</div>`;setTimeout(()=>{ri++;showRapid()},850)}},1000)}function ansRapid(i){clearInterval(rt);let q=rq[ri];if(i==q[3])rs++;$$("#rbody .choice").forEach((b,n)=>{if(n==q[3])b.classList.add("correct");if(n==i&&n!=q[3])b.classList.add("wrong");b.disabled=true});re.innerHTML=`<div class="explain">${q[4]}</div>`;setTimeout(()=>{ri++;showRapid()},850)}
function renderMnem(){mnemonics.innerHTML=`<div class="box"><h2>Mnemonics</h2><div class="grid">${MN.map(x=>`<div class="card"><h3 class="orange">${x[0]}</h3><p>${x[1]}</p></div>`).join("")}</div></div>`}function renderWorked(){worked.innerHTML=`<div class="box"><h2>Worked Examples</h2><div class="grid">${WORK.map(w=>`<div class="card"><h3>${w[0]}</h3><ol>${w[1].map(s=>`<li>${s}</li>`).join("")}</ol></div>`).join("")}</div></div>`}
function renderMachines(){let cols=Object.keys(MACH[0]),maj={};cols.forEach(c=>{let m={};MACH.forEach(r=>m[r[c]]=(m[r[c]]||0)+1);maj[c]=Object.entries(m).sort((a,b)=>b[1]-a[1])[0][0]});machines.innerHTML=`<div class="box"><h2>Machine Comparison</h2><p>Six-machine side-by-side table. Orange cells differ from the majority in that column. Tap any row to focus it. Values can be replaced exactly when the official attached table is uploaded.</p><div style="overflow:auto"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${MACH.map(r=>`<tr onclick="this.classList.toggle('focus')">${cols.map(c=>`<td class="${c!="Machine"&&r[c]!=maj[c]?"diff":""}">${r[c]}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`}
function closeOverlay(){ov.classList.remove("show")}document.onkeydown=e=>{if(e.key=="Escape")closeOverlay();if(e.code=="Space"&&tab=="lessons"){e.preventDefault();pauseRead()}if(tab=="flashcards"){if(e.key=="ArrowRight")nextFlash();if(e.key=="ArrowLeft")prevFlash();if(e.key.toLowerCase()=="f")flipFlash()}if(e.key=="Enter"&&tab=="fill"&&$("#fa"))ansFill()};init();
</script>
</body>
